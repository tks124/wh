<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站维护中 - 请稍后访问</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            padding: 20px;
        }

        .maintenance-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 60px 40px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .image-wrapper {
            margin-bottom: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-wrapper img {
            max-width: 80px;
            height: auto;
            display: block;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #1a1a2e;
        }

        p {
            font-size: 16px;
            line-height: 1.8;
            color: #555;
            margin-bottom: 12px;
        }

        .highlight {
            color: #764ba2;
            font-weight: 600;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #eee;
            border-radius: 2px;
            margin: 30px 0 20px;
            overflow: hidden;
        }

        .progress-bar::after {
            content: '';
            display: block;
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
            animation: progress 2s ease-in-out infinite;
        }

        @keyframes progress {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(350%);
            }
        }

        .footer-text {
            font-size: 13px;
            color: #999;
            margin-top: 10px;
        }

        @media (max-width: 480px) {
            .maintenance-card {
                padding: 40px 24px;
            }
            h1 {
                font-size: 22px;
            }
            .image-wrapper img {
                max-width: 64px;
            }
        }
    </style>
</head>
<body>
    <div class="maintenance-card">
        <div class="image-wrapper">
            <img src="ul.png" alt="pvz2 高级创作地图ID">
        </div>
        <h1>网站正在维护中</h1>
        <p>我们正在对整个网站进行更新，以确保内容不会有问题</p>
        <p>预计维护时间：<span class="highlight">1天</span></p>

        <div class="progress-bar"></div>

        <p>感谢您的耐心等待，请稍后再访问。</p>
        <p class="footer-text">如有紧急事务，请联系：tks124@foxmail.com</p>
    </div>
</body>
</html>
